services:
    frontend:
        ports:
            - "80:80"
        volumes:
            - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
        env_file:
            - .env.dev

    backend:
        ports:
            - "3001:3001"
        env_file:
            - .env.dev

    db:
        ports:
            - "5432:5432"
        env_file:
            - .env.dev
