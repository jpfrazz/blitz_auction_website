name: Build and Push and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: blitz-auction-frontend
            context: ./frontend/
            dockerfile: ./dockerfiles/frontend-nginx.Dockerfile
          - image_name: blitz-auction-backend
            context: ./backend/
            dockerfile: ./dockerfiles/backend.Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:blitz-gh-action

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          cat <<EOF > ~/.ssh/config
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Deploy via SSH
        run: |
          ssh server << 'EOF'
            set -e
            cd /home/game/blitz_auction_website
            git fetch
            git checkout origin/main -- docker-compose.yml docker-compose.prod.yml
            docker compose pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
            docker image prune -f
          EOF
