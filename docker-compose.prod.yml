services:
    frontend:
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        env_file:
            - .env.prod
    backend:
        env_file:
            - .env.prod
    db:
        env_file:
            - .env.prod
    # cloudflare tunnel
    tunnel:
        command: tunnel run
        environment:
          - TUNNEL_TOKEN=${TUNNEL_TOKEN}
