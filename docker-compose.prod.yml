services:
    frontend:
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/certs:/etc/nginx/ssl:ro
        ports:
          - "80:80"
          - "443:443"
        env_file:
            - .env.prod

    backend:
        env_file:
            - .env.prod

    db:
        env_file:
            - .env.prod
