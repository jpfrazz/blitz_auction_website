services:
    # react dev server
    react-server:
        image: ghcr.io/jpfrazz/blitz-auction-frontend-dev-server:latest
        build: 
            context: ./frontend/
            dockerfile: ../dockerfiles/frontend-dev-server.Dockerfile
        env_file:
            - .env
        volumes:
            - ./frontend:/app

    # nginx
    frontend:
        image: ghcr.io/jpfrazz/blitz-auction-frontend:latest
        build: 
            context: ./frontend/
            dockerfile: ../dockerfiles/frontend-nginx.Dockerfile
        container_name: auction-frontend
        restart: always
        env_file:
            - .env
        ports:
            - "80:80"
        depends_on:
            - backend
        networks:
            - auction_net

    # rust axum
    backend:
        image: ghcr.io/jpfrazz/blitz-auction-backend:latest
        build: 
            context: ./backend/
            dockerfile: ../dockerfiles/backend.Dockerfile
        container_name: auction-backend
        restart: always
        ports:
            - "${AXUM_SERVER_PORT}:${AXUM_SERVER_PORT}"
        depends_on:
            - db
        environment:
            - DB_CONN_STRING=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB
        env_file:
            - .env
        networks:
            - auction_net

    # cloudflare tunnel
    tunnel:
        image: cloudflare/cloudflared:latest
        container_name: auction-tunnel
        restart: always
        command: tunnel --url http://frontend:80
        # command: tunnel run
        # environment:
        #   - TUNNEL_TOKEN=${TUNNEL_TOKEN}
        networks:
            - auction_net

    # postgres db
    db:
        image: postgres:18-trixie
        container_name: auction-db
        restart: always
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=$POSTGRES_USER
            - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            - POSTGRES_DB=$POSTGRES_DB
        volumes:
            - db_data:/var/lib/postgresql
        networks:
            - auction_net

networks:
    auction_net:
        driver: bridge

volumes:
    db_data:
